contact_email: "anpntk24414h@st.uel.edu.vn"   # BẮT BUỘC sửa: SEC yêu cầu User-Agent có email
seed: 42

us:
  tickers: [AAPL, MSFT, AMZN, GOOGL, META, NVDA, INTC, CSCO, ORCL, IBM, CRM,
            JPM, BAC, WFC, GS, AXP, V, MA, TRV,
            JNJ, PFE, MRK, UNH, AMGN,
            PG, KO, PEP, WMT, COST, HD, LOW, MCD, NKE, DIS, NFLX, CMCSA,
            CVX, XOM, CAT, BA, HON, MMM, UPS, F, GM, VZ, T, DUK, NEE, SO]
  predecessor_ciks:                 # company_tickers.json chỉ cho CIK HIỆN TẠI; tái cấu trúc holding → 10-K cũ nằm ở CIK tiền nhiệm
    XOM: ["0000034088"]             # Exxon Mobil Corp → ExxonMobil Holdings Corp (CIK 2115436, chưa nộp 10-K nào)
    DIS: ["0001001039"]             # Walt Disney Co cũ (TWDC Enterprises 18) → holding mới 2019
    GOOGL: ["0001288776"]           # Google Inc. → Alphabet (10/2015)
  filing_years: [2015, 2024]        # năm NỘP 10-K
  forms: ["10-K"]
  max_rps: 8                        # SEC cho phép ≤10 request/giây
  market_symbol: "^GSPC"
  price_start: "2013-06-01"
  mdna_min_words: 250

vn:
  tickers_file: data/vn/tickers.csv # tạo tự động từ vnstock (VN30 + VN100)
  years: [2016, 2025]               # năm của BCTN (công bố năm sau)
  prefer_lang: vi                   # vi | en
  sleep: 0.6
  price_source: cafef_hybrid        # vnstock | cafef_csv | cafef_hybrid  (xem CHANGELOG_RUN #15, #19)
  cafef_csv_dir: data/vn/raw/prices_cafef
  market_symbol: VNINDEX
  price_start: "2015-01-01"
  extract:
    max_scan_pages: 40
    max_letter_pages: 6
    ocr_lang: vie
    ocr_dpi: 300
    llm:                            # tầng AI (v03 --llm) – xem src/textkit/llm_client.py; key: GEMINI_API_KEY / ANTHROPIC_API_KEY (.env)
      enabled: true                 # false → pipeline chạy như cũ (lớp chữ + OCR), không gọi API
      provider: gemini              # gemini | claude
      fallback_provider: claude     # dùng khi provider chính lỗi liên tục (chỉ khi có key)
      model_gemini: gemini-3.5-flash-lite   # docs 28/09/2026: Flash-Lite hỗ trợ ảnh, có gói miễn phí; paid $0,30/$2,50 per 1M token
      model_claude: claude-haiku-4-5        # model Claude nhận temperature=0 (Opus 5/Sonnet 5 bỏ temperature → 400); $1/$5 per 1M
      mode: vision                  # vision: gửi ảnh trang, chép nguyên văn | text_fix: gửi text OCR + ảnh, chỉ sửa lỗi ký tự/dấu
      quality_threshold: 0.85       # trang có quality_score < ngưỡng → gửi AI
      similarity_min: 0.8           # text_fix: tương đồng ký tự với bản OCR < ngưỡng → coi là "viết lại", loại
      dpi: 200                      # độ phân giải ảnh trang gửi AI
      requests_per_minute: 10       # nhịp gọi tối đa (gói miễn phí Gemini; xem giới hạn thật ở AI Studio)
      max_pages_per_doc: 6
      max_total_calls: 800          # trần số lượt gọi API thật mỗi lần chạy (cache không tính)
      max_consecutive_failures: 3   # provider chính lỗi liên tiếp ≥ N → ưu tiên provider dự phòng
      max_retries: 4                # thử lại khi 429/5xx/mạng (backoff 2, 4, 8… giây)
      recitation_fallback: text_fix # Gemini chặn chép nguyên văn (RECITATION) → thử chế độ text_fix cho trang đó; "none" để tắt
      locate: true                  # regex không thấy thư → hỏi AI trang bắt đầu/kết thúc (chỉ gửi 300 ký tự đầu mỗi trang)

event:                              # dùng chung cho 2 thị trường
  est_window: [-150, -11]
  min_est_obs: 80
  windows: [[0, 3], [0, 1], [-1, 1], [0, 5], [0, 10]]
  main_window: [0, 3]               # T → T+3 (như Loughran & McDonald 2011)
  placebo_shift: -60
  caar_path: [-10, 10]              # đường CAAR theo ngày cho hình vẽ
